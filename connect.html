<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Liess Ventures</title>
    <meta name="description" content="Take a seat at the board. Tell us what you're building.">
    <link rel="icon" type="image/png" sizes="256x256" href="assets/favicon.png">
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/pages/home.css">
    <link rel="stylesheet" href="css/pages/connect.css">
</head>
<body class="antialiased">

    <!-- Reading Progress Bar -->
    <div class="progress-bar" id="progressBar"></div>

    <!-- Cursor Glow Effect -->
    <div class="cursor-glow" id="cursorGlow"></div>

    <!-- ═══════════════════════════════════════════════════════════
         THE RAIL
         ═══════════════════════════════════════════════════════════ -->
    <nav class="nav-home" id="siteRail">
        <a href="index.html" class="logo-box logo-entrance">
            <img src="assets/fox.svg" alt="Liess Ventures Fox" class="logo-fox">
        </a>

        <button class="nav-mobile-toggle" id="navToggle" aria-label="Toggle Navigation">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>

        <div class="nav-links" id="navLinks">
            <a href="index.html" class="nav-link hover-link">Home</a>
            <a href="connect.html" class="nav-link hover-link is-current">Sign Up</a>
        </div>

        <span class="rail-wordmark">Liess <em>Ventures</em></span>
        <span class="rail-meta">Est. 2024</span>
    </nav>

    <!-- ═══════════════════════════════════════════════════════════
         PAGE SHELL
         ═══════════════════════════════════════════════════════════ -->
    <div class="page-shell petition-page">

        <!-- Petition Intro -->
        <header class="petition-intro">
            <h1 class="petition-title reveal" data-reveal>
                Take a <em>Seat</em>.
            </h1>
            <p class="petition-lede reveal delay-200" data-reveal data-i18n="connect.subheadline">
                What occupies your mind these days? What are you building?
                Make your entry below — the board has room.
            </p>
        </header>

        <!-- The Entry Form -->
        <main class="petition-main">

            <form class="petition-form reveal delay-400" data-reveal id="petitionForm">

                <!-- 01 · Thought -->
                <div class="entry-row">
                    <span class="entry-index">01</span>
                    <div class="entry-field">
                        <label for="thought" class="entry-label" data-i18n="connect.form.thought_label">Your Thought</label>
                        <textarea
                            id="thought"
                            name="thought"
                            class="entry-textarea"
                            placeholder="A vision, an idea, something you're building..."
                            data-i18n="connect.form.thought_placeholder"
                            rows="3"
                            required
                        ></textarea>
                    </div>
                </div>

                <!-- 02 · Name -->
                <div class="entry-row">
                    <span class="entry-index">02</span>
                    <div class="entry-field">
                        <label for="name" class="entry-label" data-i18n="connect.form.name_label">Your Name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            class="entry-input"
                            placeholder="How should we call you?"
                            data-i18n="connect.form.name_placeholder"
                            required
                        >
                    </div>
                </div>

                <!-- 03 · Email -->
                <div class="entry-row">
                    <span class="entry-index">03</span>
                    <div class="entry-field">
                        <label for="email" class="entry-label" data-i18n="connect.form.email_label">Your Email</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            class="entry-input"
                            placeholder="Where can we reach you?"
                            data-i18n="connect.form.email_placeholder"
                            required
                        >
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="petition-submit" id="submitBtn">
                    <span class="petition-submit-text" data-i18n="connect.form.submit">Send Signal</span>
                    <span class="petition-submit-arrow">&nearr;</span>
                </button>

            </form>

            <p class="petition-promise" data-i18n="connect.footer_promise">We'll be in touch.</p>

            <!-- Receipt (hidden until success) -->
            <div class="receipt" id="receipt">
                <div class="receipt-stamp">
                    <span class="receipt-no">No. 004</span>
                    <h2 class="receipt-title" data-i18n="connect.success.title">Entry Recorded</h2>
                    <p class="receipt-text" data-i18n="connect.success.text">Your words are in the ledger. We'll be in touch soon.</p>
                </div>
            </div>

        </main>

    </div>

    <!-- ═══════════════════════════════════════════════════════════
         JAVASCRIPT
         ═══════════════════════════════════════════════════════════ -->
    <script src="js/main.js"></script>
    <script>
        const form = document.getElementById('petitionForm');
        const submitBtn = document.getElementById('submitBtn');
        const receipt = document.getElementById('receipt');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = {
                thought: document.getElementById('thought').value.trim(),
                name: document.getElementById('name').value.trim(),
                email: document.getElementById('email').value.trim(),
                timestamp: new Date().toISOString()
            };

            if (!formData.thought || !formData.name || !formData.email) {
                shakeButton();
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(formData.email)) {
                shakeButton();
                return;
            }

            submitBtn.classList.add('loading');

            try {
                const response = await fetch('/api/submit-form', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (!response.ok) throw new Error('Submission failed');

                showReceipt();

            } catch (error) {
                submitBtn.classList.remove('loading');
                shakeButton();
            }
        });

        function shakeButton() {
            submitBtn.style.animation = 'shake 0.5s ease';
            setTimeout(() => { submitBtn.style.animation = ''; }, 500);
        }

        function showReceipt() {
            form.style.display = 'none';
            document.querySelector('.petition-promise').style.display = 'none';
            receipt.classList.add('visible');
        }

        // Shake animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                0%, 100% { transform: translateX(0); }
                20% { transform: translateX(-8px); }
                40% { transform: translateX(8px); }
                60% { transform: translateX(-8px); }
                80% { transform: translateX(8px); }
            }
        `;
        document.head.appendChild(style);

        // Textarea auto-resize
        const textarea = document.getElementById('thought');
        textarea.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 400) + 'px';
        });
    </script>

</body>
</html>
